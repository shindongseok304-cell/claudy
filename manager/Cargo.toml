[package]
name = "claudy-manager"
version = "0.6.8"
edition = "2024"
description = "Claudy 설정 프로그램 (Windows WebView2, macOS WKWebView, Linux WebKitGTK 화면)"

[lib]
name = "claudy_manager"
path = "src/lib.rs"

[[bin]]
name = "ClaudyManager"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"

[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"
rfd = { version = "0.17", default-features = false }
raw-window-handle = "0.6"
webview2-com-sys = "0.39"
tray-icon = "0.26"
uiautomation = "0.25"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security_Authorization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57"
tao = "0.37"
rfd = { version = "0.17", default-features = false }
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
wry = "0.57"
tao = "0.37"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
tray-icon = "0.26"

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
webview2-com-sys = { path = "vendor/webview2-com-sys" }
