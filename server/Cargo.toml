[package]
name = "claudy"
version = "0.1.33"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now" ] }
regex = "1.13.1"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v4"] }
encoding_rs = "0.8.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "now", "clock"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
strip = true
opt-level = 3
