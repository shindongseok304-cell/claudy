name: 릴리스
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cross:
    name: Linux·Windows 빌드
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            manager
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libxdo-dev mingw-w64
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - run: scripts/build_cross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bin-cross
          path: dist/bin
  mac:
    name: macOS 빌드
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            manager
      - run: zsh scripts/build_mac.sh
      - name: 묶기(앱 서명 유지를 위해 tar 로 옮김)
        run: tar -C dist/bin -cf bin-mac.tar mac
      - uses: actions/upload-artifact@v4
        with:
          name: bin-mac
          path: bin-mac.tar
  package:
    name: 배포 파일
    needs: [cross, mac]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: bin-cross
          path: dist/bin
      - uses: actions/download-artifact@v4
        with:
          name: bin-mac
      - run: tar -C dist/bin -xf bin-mac.tar && chmod +x dist/bin/*/claudy dist/bin/linux-x86_64/ClaudyManager
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release
      - name: 릴리스에 올리기(태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Claudy ${GITHUB_REF_NAME#v}" --notes "자동 빌드"
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
